# runtime.ini - configuracion de ejecucion del controlador (la lee Webots, NO el codigo).
# No confundir con config.ini, que contiene los parametros de la marcha.
#
# En esta primera version no se activa nada. El ejemplo oficial "walk" funciona con
# las DLL de managers y robotis-op2 sin necesidad de ajustes; antes de activar
# cualquier linea de abajo, compara con la carpeta controllers\walk y con la seccion
# "runtime.ini" del manual de referencia de Webots (sintaxis de secciones por
# plataforma). Si walk no usa runtime.ini y el controlador arranca bien, este
# archivo puede quedarse asi (solo comentarios).
#
# Ejemplo (NO verificado, solo si las DLL no se encontraran en Windows):
# [environment variables with paths for Windows]
# PATH=<rutas a libraries\managers y libraries\robotis-op2>
